name: Changelog

# Light structural gate for the public CHANGELOG.md: Keep a Changelog shape, an
# "## [Unreleased]" section, ISO/non-future dates, descending unique dated
# sections, and the fixed category set. Deliberately NOT a leak-check (this repo
# is public) and NOT a release tag-gate (the Feature and installers version
# independently). Runs on EVERY PR (no path filter) so it can be a reliable
# required status check — a path-filtered workflow that skips leaves a required
# check forever "waiting", blocking unrelated PRs. The check is fast + pure bash.

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Structure + self-test
        run: |
          make validate-changelog
          make validate-changelog-test
