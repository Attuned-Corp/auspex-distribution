name: CI

# Fast gate for the Dev Container Feature installer's download-integrity contract: a PURE bash+HTTP test
# (no Docker/devcontainer CLI) that drives src/span-auspex/install.sh through every verify: mode and
# asserts a tampered/absent checksum fails CLOSED. Runs on every PR that touches the Feature.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Makefile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  install-verify:
    name: Installer verify contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh download-integrity contract
        run: make verify-test
